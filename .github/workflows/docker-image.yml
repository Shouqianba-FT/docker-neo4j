name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest
    env: 
      NEO4JVERSION: 5.26.0
      

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: make build-debian-community
